check:
  interval_seconds: 30
  consecutive_failures_threshold: 3

# вкрадені 201/202 — після монтажу нових камер додай окремі блоки
theft_prompt_after_minutes: 30

image_check:
  enabled: true
  interval_seconds: 60
  consecutive_failures: 3
  black_threshold: 0.02
  white_threshold: 0.98
  contrast_threshold: 0.03
  blocked_threshold: 0.001
  blur_threshold: 50.0
  frozen_frame:
    enabled: true
    night_enabled: false    # v2.1: ніччю (22-06 Kyiv) статичний під'їзд = норма, не алерт
    min_interval_minutes: 5
    similarity_threshold: 0.995
    method: "phash"
  night_profile:
    timezone: "Europe/Kyiv"
    start_hour: 22
    end_hour: 6
    overrides:
      black_threshold: 0.005
      contrast_threshold: 0.015   # IR-ніч: сцени темні й малоконтрастні — норма
      blur_threshold: 30
      blocked_threshold: 0.0003   # IR-ніч: повністю закритий об'єктив тільки

events:
  path: "data/events"
  retention_days: 30
  cleanup_interval_hours: 24

state_db: "data/state.sqlite3"

telegram:
  enabled: true
  cooldown_minutes: 30
  send_snapshot_on_image_issue: true
  digest_minutes: 0

metrics:
  enabled: false
  port: 8000

logging:
  level: "INFO"
  handler: "journald"